name: Build nationwide village address data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 1 */3 *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build province-scoped village datasets
        run: python scripts/build_china_villages.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china-villages
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Build nationwide five-level village address data"
            git push
          fi
